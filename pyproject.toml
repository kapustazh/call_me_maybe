[project]
name = "call-me-maybe"
version = "1.0.0"
description = "Function calling tool that translates natural language prompts into structured function calls"
requires-python = ">=3.11"
dependencies = [
    "llm-sdk",
    "numpy>=1.24.0",
    "pydantic>=2.0.0",
    "textual>=0.30.0",
]

[dependency-groups]
dev = [
    "flake8>=7.0.0",
    "mypy>=1.10.0",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["llm_sdk"]

[tool.uv.sources]
llm-sdk = { workspace = true }
